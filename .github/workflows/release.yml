# Releases: see docs/releasing.md. There is no npm token anywhere: `publish` authenticates to npm
# with a short-lived OIDC token (npm trusted publishing), so `pnpm changeset publish` runs here only.
# Do not add `registry-url` to setup-node: it makes setup-node write an auth-token placeholder into
# .npmrc and breaks OIDC (pnpm check:workflows enforces this).
name: Release

on:
  push:
    branches: [main]
  # Retry after a failed or rejected publish (run it on main).
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Pending changesets: open or update the "Version Packages" PR. Nothing pending and the version in
  # package.json is not on npm yet (the Version PR was just merged): ask for a publish.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # v2, not v1: @changesets/cli 3 moves the consumed changesets to .changeset/pre/ in pre mode
      # and the reader bundled in v1 fails on that directory (scripts/release/changeset-flow.test.mjs).
      # No `publish` input: publishing is the `publish` job. Tags and releases are made there too.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset version
          pr-title: Version Packages
          commit-message: 'chore: version packages'
          create-github-releases: false
          push-git-tags: false
      - id: plan
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          V=$(node -p "require('./packages/tally-charts/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if out=$(npm view "tally-charts@$V" version 2>npm-view.err); then
            if [ -z "$out" ]; then
              echo "tally-charts@$V is not on npm yet"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "tally-charts@$V is already on npm, nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q E404 npm-view.err; then
            echo "tally-charts@$V is not on npm yet"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err
            exit 1
          fi

  # The same checks as the `check` job in ci.yml. Keep the two in sync.
  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # After the build: src/dts-parse.test.ts reads dist and must not be skipped here.
      - run: pnpm test
        env:
          REQUIRE_DIST: '1'
      - run: pnpm --filter tally-charts api:check
      - run: pnpm size
      - run: pnpm --filter tally-charts check:dev-strip
      - run: pnpm --filter tally-charts check:treeshake
      - run: pnpm --filter tally-charts check:dts

  # Waits for a reviewer on the `npm-publish` environment (Actions -> Review deployments).
  publish:
    needs: [version, verify]
    runs-on: ubuntu-latest
    # Counts from the approval, not from the wait for a reviewer.
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No `cache: pnpm`: the job that can publish does not restore a cache other jobs wrote.
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1. An exact version, not a range.
      - run: npm install -g npm@11.9.0
      - run: node scripts/release/check-npm-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No --tag: in pre mode changesets publishes to the pre tag (rc) and refuses --tag.
      # prepublishOnly runs the full check suite again.
      - run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          PNPM_CONFIG_PROVENANCE: 'true'
      # `pnpm publish` does the OIDC exchange itself (not the npm CLI), so do not trust the env flags:
      # fail when the published version carries no provenance attestation. The registry can lag.
      - name: Check provenance
        run: |
          for i in 1 2 3 4 5 6; do
            att=$(npm view "tally-charts@$VERSION" dist.attestations.url 2>/dev/null || true)
            if [ -n "$att" ]; then
              echo "provenance attestation: $att"
              exit 0
            fi
            echo "no attestation yet (attempt $i), waiting"
            sleep 10
          done
          # Staged publishing: the version stays hidden until it is approved on npmjs.com.
          if [ -z "$(npm view "tally-charts@$VERSION" version 2>/dev/null || true)" ]; then
            echo "::error::tally-charts@$VERSION is not visible on npm. If it was staged, approve it on npmjs.com, then re-run this job"
            exit 1
          fi
          echo "::error::tally-charts@$VERSION has no provenance attestation"
          exit 1
      # Idempotent: a re-run after a partial failure skips what already exists. The
      # tally-charts@x.y.z tags that changesets creates locally are not pushed.
      - name: Tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists"
            exit 0
          fi
          node scripts/release/changelog-section.mjs "$VERSION" > notes.md
          args=(--title "v$VERSION" --notes-file notes.md)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          gh release create "v$VERSION" "${args[@]}"
