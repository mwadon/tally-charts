name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: pnpm --filter tally-charts check:dev-strip

  # Unit tests on the oldest supported React major. Types stay on 19.
  react18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tally-charts add -D react@18.3.1 react-dom@18.3.1
      - run: pnpm test

  # Baselines live in apps/storybook/e2e/__screenshots__/{darwin,linux}. CI never writes them
  # (updateSnapshots is 'none' on CI). To refresh the linux baselines, run this from the repo root.
  # It regenerates them in a copy of the repo (the host node_modules stays untouched), runs the
  # suite again without updating, and copies the PNGs out only if that verify run passes:
  #   docker run --rm -v "$PWD":/src:ro -v "$PWD/apps/storybook/e2e/__screenshots__":/out \
  #     mcr.microsoft.com/playwright:v1.64.0-noble sh -c '
  #       mkdir /w && cd /src && tar --exclude=node_modules --exclude=.git --exclude=storybook-static -cf - . | tar -xf - -C /w &&
  #       cd /w && corepack enable && pnpm install --frozen-lockfile &&
  #       pnpm --filter storybook-app exec playwright test --update-snapshots=all; pnpm test:e2e &&
  #       mkdir -p /out/linux && cp -r apps/storybook/e2e/__screenshots__/linux/. /out/linux/'
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - name: Upload screenshots (commit new linux baselines from here)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            apps/storybook/e2e/__screenshots__
            apps/storybook/test-results
