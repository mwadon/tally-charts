# Dependencies are pinned to exact versions, so updates only arrive through these PRs.
# Minor and patch updates come as one grouped PR per ecosystem; majors come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the ranges of the library's runtime dependencies as they are; only pins move.
    versioning-strategy: increase-if-necessary
    ignore:
      # The Playwright version is tied to the container image in ci.yml and to the screenshot
      # baselines of both platforms, and @axe-core/playwright pulls its own playwright-core.
      # Update them by hand, together with the image and the baselines.
      - dependency-name: '@playwright/test'
      - dependency-name: '@axe-core/playwright'
      # 3.2.5 and 3.1.1 ship one bundled file instead of modules and add about 0.6 kB to every
      # chart (LineChart 13.82 -> 14.43 kB, over its limit). Held until that is decided.
      - dependency-name: d3-array
        versions: ['>=3.2.5']
      - dependency-name: d3-time
        versions: ['>=3.1.1']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Workflows pin actions to commit SHAs; Dependabot moves the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
